
name: Generate Pink Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: Shahisha1
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23E8A0B5&color_dots=%23F6DDE3,%23E8A0B5,%23D17F99,%23B94F6A,%23754354
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23E8A0B5&color_dots=%2330232B,%23754354,%23F6DDE3,%23E8A0B5,%23B94F6A

      - name: Publish generated SVG files
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
