
name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate forest-green snake
        uses: Platane/snk@v3
        with:
          github_user_name: Shahisha1
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=%2391C49C&color_dots=%23071510%3B%2311261B%3B%231B3A29%3B%23365F43%3B%235B9368

      - name: Publish snake to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: output
          force_orphan: true
